[project]
name = "skogwork"
version = "0.1.0"
description = "Local Cowork-alike: Claude Agent SDK REPL with skills, MCP and persistent sessions"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.60",
    "prompt-toolkit>=3.0.47",
    "rich>=13.7",
]

[project.scripts]
skogwork = "skogwork.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skogwork"]
